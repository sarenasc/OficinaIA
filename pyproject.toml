[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "oficina-ia-local"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "websockets>=15,<17", "sqlalchemy>=2.0,<3", "alembic>=1.15,<2", "psycopg[binary]>=3.2,<4", "pydantic>=2.10,<3", "httpx>=0.28,<1", "openpyxl>=3.1,<4", "keyring>=25,<26", "redis>=5,<7", "python-dotenv>=1,<2", "jsonschema>=4.23,<5", "sqlglot>=26,<30", "reportlab>=4.4,<5", "pypdf>=6,<7", "pillow>=11,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]
sql = ["pyodbc>=5,<6", "pymysql>=1,<2"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
